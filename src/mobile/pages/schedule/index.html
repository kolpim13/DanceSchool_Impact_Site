<!doctype html>
<html lang="pl">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Impact - Grafik</title>
		<link rel="stylesheet" href="/src/styles/tokens.css">
		<link rel="stylesheet" href="/src/styles/fonts.css">
		<link rel="stylesheet" href="/src/styles/base.css">
		<link rel="stylesheet" href="/src/styles/components.css">
		<link rel="stylesheet" href="/src/mobile/partials/header/header.css">
		<link rel="stylesheet" href="/src/mobile/partials/footer/footer.css">
		<link rel="stylesheet" href="/src/mobile/pages/schedule/schedule.css">
	</head>
	<body>
		<header class="site-header" data-impact-header>
			<nav class="mobile-nav" aria-label="Menu główne">
				<a class="mobile-logo" href="#home" data-stub="home" aria-label="Impact - strona główna">
					<img src="/assets/impact-logo.png" alt="" width="40" height="40">
				</a>
				<div class="mobile-actions">
					<button class="language-switcher" type="button" data-stub="language" aria-label="Zmień język">PL</button>
					<button class="menu-toggle" type="button" data-menu-toggle aria-label="Otwórz menu" aria-expanded="false">
						<span></span><span></span><span></span>
					</button>
				</div>
			</nav>
		</header>
		<div data-expanded-menu-host></div>
		<main id="app-page">
			<article class="schedule-page">
				<div class="schedule-page__inner">
					<p class="schedule-page__eyebrow">Impact / Studio Tańca</p>
					<h1 class="schedule-page__title">Grafik zajęć</h1>
					<p class="schedule-page__intro">Plan na najbliższe dni jest przygotowany jako placeholder i zostanie uzupełniony danymi z backendu w przyszłości.</p>

					<div class="schedule-filter" role="tablist" aria-label="Wybierz dzień tygodnia">
						<button class="schedule-filter__item is-active" type="button" data-day="mon" aria-selected="true">Pn</button>
						<button class="schedule-filter__item" type="button" data-day="tue" aria-selected="false">Wt</button>
						<button class="schedule-filter__item" type="button" data-day="wed" aria-selected="false">Śr</button>
						<button class="schedule-filter__item" type="button" data-day="thu" aria-selected="false">Cz</button>
						<button class="schedule-filter__item" type="button" data-day="fri" aria-selected="false">Pt</button>
					</div>

					<div class="schedule-list" data-schedule-list aria-live="polite"></div>
				</div>
			</article>
		</main>
		<div data-footer-host></div>
		<p id="stub-status" class="sr-only" aria-live="polite"></p>
		<script type="module" src="/src/mobile/pages/schedule/schedule.js"></script>
	</body>
</html>
