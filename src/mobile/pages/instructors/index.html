	<body>
		<header class="site-header" data-impact-header>
			<nav class="mobile-nav" aria-label="Menu główne">
				<a class="mobile-logo" href="#home" data-stub="home" aria-label="Impact - strona główna">

						</article>
						<article class="instructor-card">

						</article>
						<article class="instructor-card">
							<div class="instructor-card__portrait" aria-hidden="true">ZN</div>
							<div class="instructor-card__body"><h2 class="instructor-card__name">Zofia Nowak</h2><p class="instructor-card__role">Jazz · contemporary</p></div>

					</div>
				</div>

		<p id="stub-status" class="sr-only" aria-live="polite"></p>
