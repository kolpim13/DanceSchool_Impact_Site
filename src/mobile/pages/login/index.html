<!doctype html>
<html lang="pl">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Impact - Zaloguj się</title>
		<link rel="stylesheet" href="/src/styles/tokens.css">
		<link rel="stylesheet" href="/src/styles/fonts.css">
		<link rel="stylesheet" href="/src/styles/base.css">
		<link rel="stylesheet" href="/src/styles/components.css">
		<link rel="stylesheet" href="/src/mobile/partials/header/header.css">
		<link rel="stylesheet" href="/src/mobile/partials/footer/footer.css">
		<link rel="stylesheet" href="/src/mobile/pages/login/login.css">
		<script type="importmap">{"imports":{"openapi-fetch":"/vendor/openapi-fetch.js"}}</script>
	</head>
	<body>
		<div data-header-host></div>
		<div data-expanded-menu-host></div>
		<main id="app-page">
			<article class="login-page">
				<div class="login-page__inner">
					<h1 class="login-page__title">Zaloguj się</h1>
					<p class="login-page__intro">Twój kolejny taniec jest już blisko.</p>

					<form class="login-form" data-login-form novalidate>
						<div class="field">
							<label for="login-email">Adres e-mail</label>
							<input id="login-email" name="email" type="email" placeholder="twoj@email.pl" autocomplete="email" required>
						</div>
						<div class="field">
							<label for="login-password">Hasło</label>
							<input id="login-password" name="password" type="password" placeholder="Wpisz hasło" autocomplete="current-password" required>
						</div>

						<div class="login-form__row">
							<label class="consent">
								<input type="checkbox" name="remember">
								<span class="consent-glyph" aria-hidden="true"></span>
								Zapamiętaj mnie
							</label>
							<a class="login-form__forgot" href="#forgot-password" data-stub="forgot-password">Nie pamiętasz hasła?</a>
						</div>

						<button class="button button-primary login-form__submit" type="submit">Zaloguj się</button>

						<p id="login-form-status" class="login-form__status" role="alert" aria-live="polite"></p>
					</form>

					<p class="login-page__signup">Nie masz konta? <a href="/src/mobile/pages/registration/index.html">Dołącz do nas</a></p>

					<p class="login-page__hint muted">Możesz przeglądać stronę bez zakładania konta.</p>
					<a class="login-page__guest" href="/src/mobile/pages/instructors/index.html" data-stub="guest">&larr; Wróć do przeglądania jako gość</a>
				</div>
			</article>
		</main>
		<div data-footer-host></div>
		<p id="stub-status" class="sr-only" aria-live="polite"></p>
		<script type="module" src="/src/mobile/pages/login/login.js"></script>
	</body>
</html>
